<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ9 NEWS - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Telugu",sans-serif;
  background:#f1f3f6;
  color:#222;
}

.header{
  background:#d60000;
  color:white;
  padding:18px;
  text-align:center;
  box-shadow:0 2px 8px #999;
}

.header h1{
  font-size:26px;
}

.header p{
  margin-top:5px;
  font-size:14px;
}

.container{
  max-width:700px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 2px 12px #ccc;
}

.card h2{
  color:#d60000;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:8px;
  background:#d60000;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#a80000;
}

.preview{
  margin-top:20px;
  display:none;
  text-align:center;
}

.preview img{
  max-width:100%;
  max-height:300px;
  border-radius:10px;
}

.success{
  display:none;
  margin-top:15px;
  padding:12px;
  background:#d4edda;
  color:#155724;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}

.news-list{
  margin-top:25px;
}

.news-item{
  background:#fff;
  margin-top:12px;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 8px #ddd;
}

.news-item h3{
  color:#d60000;
  margin-bottom:8px;
}

.news-item small{
  color:#777;
}

.delete{
  background:#333;
  margin-top:10px;
  padding:10px;
  font-size:14px;
}

.logo{
  width:70px;
  height:70px;
  object-fit:contain;
  border-radius:50%;
  background:white;
  padding:5px;
  margin-bottom:8px;
}
</style>
</head>

<body>

<header class="header">
  <div>
    <div style="font-size:45px;">📰</div>
    <h1>AJ9 NEWS</h1>
    <p>తెలుగు తాజా వార్తలు - Admin Panel</p>
  </div>
</header>

<div class="container">

  <div class="card">

    <h2>📝 కొత్త వార్తను ప్రచురించండి</h2>

    <label>వార్త శీర్షిక</label>
    <input
      type="text"
      id="title"
      placeholder="వార్త శీర్షిక ఇక్కడ రాయండి"
    >

    <label>వార్త కేటగిరీ</label>
    <select id="category">
      <option value="LOCAL NEWS">LOCAL NEWS</option>
      <option value="BREAKING NEWS">BREAKING NEWS</option>
      <option value="POLITICS">POLITICS</option>
      <option value="AP NEWS">AP NEWS</option>
      <option value="TELANGANA">TELANGANA</option>
      <option value="NATIONAL">NATIONAL</option>
      <option value="SPORTS">SPORTS</option>
      <option value="ENTERTAINMENT">ENTERTAINMENT</option>
    </select>

    <label>వార్త ఫోటో</label>
    <input
      type="file"
      id="photo"
      accept="image/*"
    >

    <div class="preview" id="preview">
      <p>ఫోటో Preview</p>
      <img id="previewImage">
    </div>

    <label>పూర్తి వార్త</label>
    <textarea
      id="content"
      placeholder="పూర్తి వార్తను ఇక్కడ రాయండి..."
    ></textarea>

    <button onclick="publishNews()">
      🔴 వార్తను Publish చేయండి
    </button>

    <div class="success" id="success">
      ✅ వార్త విజయవంతంగా Publish అయింది!
    </div>

  </div>

  <div class="news-list">

    <div class="card">
      <h2>📰 Published News</h2>
      <div id="newsList"></div>
    </div>

  </div>

</div>

<script>

let selectedImage = "";

/* IMAGE PREVIEW */
document.getElementById("photo").addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    selectedImage = e.target.result;

    document.getElementById("previewImage").src = selectedImage;

    document.getElementById("preview").style.display = "block";

  };

  reader.readAsDataURL(file);

});


/* PUBLISH NEWS */
function publishNews(){

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value;

  const content =
    document.getElementById("content").value.trim();


  if(title === ""){

    alert("దయచేసి వార్త శీర్షిక ఇవ్వండి.");

    return;

  }


  if(content === ""){

    alert("దయచేసి పూర్తి వార్తను ఇవ్వండి.");

    return;

  }


  const news = {

    id: Date.now(),

    title: title,

    category: category,

    content: content,

    image: selectedImage,

    date: new Date().toLocaleString("te-IN")

  };


  let newsData =
    JSON.parse(localStorage.getItem("AJ9NEWS")) || [];


  newsData.unshift(news);


  localStorage.setItem(
    "AJ9NEWS",
    JSON.stringify(newsData)
  );


  document.getElementById("success").style.display =
    "block";


  document.getElementById("title").value = "";

  document.getElementById("content").value = "";

  document.getElementById("photo").value = "";

  document.getElementById("preview").style.display =
    "none";

  selectedImage = "";


  loadNews();


  setTimeout(function(){

    document.getElementById("success").style.display =
      "none";

  },3000);

}


/* LOAD NEWS */
function loadNews(){

  const list =
    document.getElementById("newsList");

  let newsData =
    JSON.parse(localStorage.getItem("AJ9NEWS")) || [];


  if(newsData.length === 0){

    list.innerHTML =
      "<p style='text-align:center;color:#777;'>ఇంకా వార్తలు Publish కాలేదు.</p>";

    return;

  }


  list.innerHTML = "";


  newsData.forEach(function(news){

    const item =
      document.createElement("div");

    item.className = "news-item";


    item.innerHTML = `

      ${
        news.image
        ? `<img src="${news.image}"
             style="width:100%;max-height:220px;
             object-fit:cover;border-radius:8px;
             margin-bottom:10px;">`
        : ""
      }

      <h3>${escapeHTML(news.title)}</h3>

      <small>
        🔴 ${escapeHTML(news.category)}
        • ${escapeHTML(news.date)}
      </small>

      <p style="margin-top:10px;line-height:1.6;">
        ${escapeHTML(news.content)}
      </p>

      <button
        class="delete"
        onclick="deleteNews(${news.id})">
        🗑️ ఈ వార్తను Delete చేయండి
      </button>

    `;


    list.appendChild(item);

  });

}


/* DELETE NEWS */
function deleteNews(id){

  if(!confirm("ఈ వార్తను Delete చేయాలా?")){

    return;

  }


  let newsData =
    JSON.parse(localStorage.getItem("AJ9NEWS")) || [];


  newsData =
    newsData.filter(function(news){

      return news.id !== id;

    });


  localStorage.setItem(
    "AJ9NEWS",
    JSON.stringify(newsData)
  );


  loadNews();

}


/* SECURITY */
function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* START */
loadNews();

</script>

</body>
</html>
